# One run = this file. Each entry under `chains` is one emcee chain, fully specified.
# Run directory: results/<YYYY-MM-DD_HHMM>_<notes>/, with a copy of this file.
notes: prior-sensitivity
data: ../data/apjladf06ft3_mrt.txt   # relative to this file

chains:
  - name: uniform_st1
    seed: 0
    window: { center: 3222.0969, half_width: 1.5 } # BKJD, d
    supersample: 5
    nwalkers: 50
    nburn: 1000
    nsteps: 40000
    thin: 10
    restart_keep: 25
    restart_jitter: 0.1
    moves: { DEMove: 0.7, StretchMove: 0.3 }
    priors:
      mid_transit_time: {dist: uniform, low: 3221.8969, high: 3222.2969}
      ln_orbital_period: {dist: single_transit, low: 4.162003, high: 7.600902, exponent: -1.666667}   # ln 64.2 .. ln 2000 d; P^-2/3 geometry x P^-1 window
      impact_parameter: {dist: impact}   # U(0, 1 + k)
      ln_planet_to_star_radius_ratio: {dist: uniform, low: -6.907755, high: -2.302585}   # ln 1e-3 .. ln 0.1
      limb_darkening: {dist: physical, mu: [0.60, 0.12], sigma: [0.07, 0.07]}
      log10_stellar_density: {dist: normal, mu: 0.462, sigma: 0.041}
      log10_stellar_mass: {dist: normal, mu: -0.139, sigma: 0.010}
      out_of_transit_flux: {dist: uniform, low: 0.99, high: 1.01}
      ln_white_noise_amplitude: {dist: uniform, low: -15.0, high: -5.0}
      eccentricity: {dist: uniform, e_max: 0.9, transit_weighted: true}

